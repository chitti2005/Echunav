{% extends 'base.html' %}
{% block title %}Register | E-Chunav{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm p-4 login-container">
      <h3 class="text-center text-primary mb-3">Voter Registration</h3>
      <form method="POST" action="{{ url_for('voter_routes.register') }}">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Voter ID</label>
          <input type="text" class="form-control" name="voter_id" required>
          <div class="form-text">Example: v101 — choose a unique ID assigned by admin or self-chosen</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-pill">Register</button>
      </form>
      <div class="text-center mt-3">
        <small>Already registered? <a href="{{ url_for('voter_routes.index') }}">Login here</a></small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
