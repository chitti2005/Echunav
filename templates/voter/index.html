{% extends 'base.html' %}
{% block title %}Voter Login | E-Chunav{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:70vh;">
  <div class="col-md-5">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4">
        <h3 class="text-center fw-bold text-primary mb-3">
          <i class="bi bi-person-circle"></i> Voter Login
        </h3>
        <hr>
        <form method="POST" action="/send_otp">
          <div class="mb-3">
            <label class="form-label">Voter ID</label>
            <input type="text" name="voter_id" class="form-control rounded-pill" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control rounded-pill" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Enter this number: <b>{{ captcha_num }}</b></label>
            <input type="text" name="captcha_answer" class="form-control rounded-pill" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 rounded-pill">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
