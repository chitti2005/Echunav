{% extends 'base.html' %}
{% block title %}OTP Verification{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow p-4 mt-4">
      <h3 class="text-center mb-3">Verify OTP</h3>
      <p class="text-center text-muted">An OTP has been sent to your registered email.</p>
      <form action="/verify_otp" method="POST">
        <div class="mb-3">
          <label class="form-label">Enter OTP</label>
          <input type="text" class="form-control" name="otp" maxlength="6" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Verify</button>
      </form>
      <div class="text-center mt-3">
        <p class="mb-1">Didn't get the OTP?</p>
        <form action="/resend_otp" method="POST" class="d-inline">
          <button class="btn btn-link" type="submit">Resend OTP</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
