{% extends 'base.html' %}
{% block title %}Error | E-Chunav{% endblock %}
{% block content %}
<div class="container text-center mt-5">
  <div class="card shadow-sm p-5 mx-auto" style="max-width: 500px;">
    <h1 class="text-danger mb-3"><i class="bi bi-exclamation-triangle-fill"></i></h1>
    <h3 class="fw-bold mb-2">Something went wrong!</h3>
    {% if message %}
      <p class="text-muted">{{ message }}</p>
    {% else %}
      <p class="text-muted">An unexpected error occurred. Please try again later.</p>
    {% endif %}
    <a href="/" class="btn btn-primary mt-3">
      <i class="bi bi-house-door"></i> Go Home
    </a>
  </div>
</div>
{% endblock %}
